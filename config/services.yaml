# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    telegram_bot_token: '%env(TELEGRAM_TOKEN)%'
    # Телефони, які отримують роль менеджера одразу при реєстрації в боті.
    # Потрібні для старту: перших менеджерів нікому підтверджувати.
    supply_manager_phones: '%env(SUPPLY_MANAGER_PHONES)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $projectDir: '%kernel.project_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Supply/Entity/'
            - '../src/Supply/Enum/'
            - '../src/Kernel.php'

    # Ключі Google Drive — рядки, автовайринг їх не підставить.
    App\Supply\Service\GoogleDriveMirror:
        arguments:
            $clientId: '%env(GOOGLE_DRIVE_CLIENT_ID)%'
            $clientSecret: '%env(GOOGLE_DRIVE_CLIENT_SECRET)%'
            $refreshToken: '%env(GOOGLE_DRIVE_REFRESH_TOKEN)%'
            $rootFolderId: '%env(GOOGLE_DRIVE_ROOT_FOLDER_ID)%'

    # Nutgram резолвить залежності хендлерів своїм контейнером із делегуванням
    # у Symfony, а той віддає лише публічні сервіси.
    App\Service\ChatScreen:
        public: true

    # Nutgram handlers
    App\Telegram\:
        public: true
        shared: false
        resource: '../src/Telegram'
        exclude:
            - '../src/Telegram/Location/Model'

    # Хендлери бота модуля постачання: shared: false обов'язковий — інакше
    # стан Conversation протікає між користувачами.
    App\Supply\Telegram\:
        public: true
        shared: false
        resource: '../src/Supply/Telegram'
