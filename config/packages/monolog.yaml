monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                # Не stderr: під PHP-FPM без catch_workers_output цей потік нікуди
                # не потрапляє, і помилки прод-стенда просто зникають.
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.json
            # Окремий журнал подій, який пишеться завжди: fingers_crossed мовчить,
            # поки немає помилки, і побачити нормальний хід роботи стенда неможливо.
            activity:
                type: rotating_file
                path: "%kernel.logs_dir%/activity.log"
                level: info
                max_files: 7
                # Файл доби створює той, хто перший щось записав. Якщо це була
                # консольна команда з-під root, php-fpm потім не міг дописати
                # в 0644-файл — і кожен апдейт бота падав у 500.
                file_permission: 0664
                channels: ["!event", "!doctrine", "!php", "!request", "!security"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
