framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # Розсилка подій «Плану» (App\Plan\EventStore\FanOut). Дефолт sync:// —
            # стенди заявок без воркера отримують усе в тому ж запиті, як раніше.
            # На Плані: doctrine://default?queue_name=plan + воркер
            # `messenger:consume plan` (той самий DBAL → outbox у тій самій транзакції).
            plan:
                dsn: '%env(PLAN_EVENTS_TRANSPORT)%'
                retry_strategy:
                    # Повтор — для збою читання події і для ідемпотентних проєкцій (пошук,
                    # Хроніка, центр сповіщень; FanOutHandler → ProjectionFailed). Telegram
                    # при повторі пропускається за позначкою. 5 с, 15 с, 45 с, 2¼ хв — далі
                    # черга failed і plan:projections:reconcile (крон).
                    max_retries: 4
                    delay: 5000
                    multiplier: 3
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Plan\EventStore\FanOut: plan

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
