security:
    # Паролів у системі немає: вхід у CRM — за одноразовим посиланням із Telegram-бота.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\TelegramUser
                property: telegram_id

    # Адміністратор уміє все, що менеджер, а менеджер — усе, що робітник.
    role_hierarchy:
        ROLE_SUPPLY_MANAGER: [ROLE_SUPPLY_WORKER]
        ROLE_SUPPLY_ADMIN: [ROLE_SUPPLY_MANAGER]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\TelegramLinkAuthenticator
            entry_point: App\Security\LoginEntryPoint
            logout:
                path: crm_logout
                target: /

    # Тільки перший збіг спрацьовує, тож /crm/auth має бути вище за /crm.
    # Вебхук бота (/hook) навмисно не в списку — він публічний.
    access_control:
        - { path: ^/crm/auth, roles: PUBLIC_ACCESS }
        - { path: ^/crm/logout, roles: PUBLIC_ACCESS }
        - { path: ^/crm, roles: ROLE_SUPPLY_MANAGER }
        - { path: ^/api, roles: ROLE_SUPPLY_MANAGER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
