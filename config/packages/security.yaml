security:
    # Основний вхід у CRM — через Telegram-бота: на «Плані» кнопка «Увійти через Telegram»
    # (TelegramLoginAuthenticator), на стендах заявок — одноразове посилання з бота.
    # Поруч — вхід за паролем (PASSWORD_LOGIN_ENABLED); на «Плані» лише паролем, який людина
    # задала сама за посиланням із бота (PasswordSetup). Вхід тримається 30 днів (remember_me).
    password_hashers:
        App\Entity\TelegramUser: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\TelegramUser
                property: telegram_id

    # Адміністратор уміє все, що менеджер, а менеджер — усе, що робітник.
    # Директор навмисно НЕ менеджер: він погоджує оплату, а не веде закупівлі.
    role_hierarchy:
        ROLE_SUPPLY_MANAGER: [ROLE_SUPPLY_WORKER]
        ROLE_SUPPLY_DIRECTOR: [ROLE_SUPPLY_WORKER]
        ROLE_SUPPLY_ADMIN: [ROLE_SUPPLY_MANAGER, ROLE_SUPPLY_DIRECTOR]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\TelegramLoginAuthenticator
                - App\Security\TelegramLinkAuthenticator
                - App\Security\PasswordLoginAuthenticator
            # 5 хибних паролів на людину+IP за 15 хв, 25 на IP, 20 на людину за годину
            # (людина = нормалізований логін, див. PlanLoginRateLimiter / LoginIdentity).
            login_throttling:
                limiter: App\Security\PlanLoginRateLimiter
            entry_point: App\Security\LoginEntryPoint
            # Вхід (Telegram чи пароль) тримається 30 днів на пристрої (Олександр 17.11: сесія
            # PHP згасала за ~24 хв простою). Кука з підписом: зміна пароля, «Це був не я»
            # (session_epoch), кошик чи допуск — і кука недійсна. «Вийти» її стирає.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /
                always_remember_me: true
                httponly: true
                secure: auto
                samesite: lax
                signature_properties: ['password', 'rememberMeStamp']
            logout:
                path: crm_logout
                target: /vhid?out=1
                delete_cookies: ['REMEMBERME']

    # Тільки перший збіг спрацьовує, тож /crm/auth має бути вище за /crm.
    # Вебхук бота (/hook) навмисно не в списку — він публічний.
    #
    # Поріг входу — робітник: спільну картину заявок бачать усі, щоб кожен знав,
    # що вже замовлено й на якому воно етапі. Право щось змінити перевіряють
    # самі контролери й сервіси (#[IsGranted] та перевірки автора).
    access_control:
        - { path: ^/crm/auth, roles: PUBLIC_ACCESS }
        - { path: ^/crm/logout, roles: PUBLIC_ACCESS }
        - { path: ^/crm, roles: ROLE_SUPPLY_WORKER }
        # Склад ведуть менеджер, адміністратор і директор (досить однієї з ролей).
        # Робітник бачить позицію лише в боті, скануючи наклейку.
        - { path: ^/sklad, roles: [ROLE_SUPPLY_MANAGER, ROLE_SUPPLY_DIRECTOR] }
        - { path: ^/shop, roles: [ROLE_SUPPLY_MANAGER, ROLE_SUPPLY_DIRECTOR] }
        - { path: ^/api, roles: ROLE_SUPPLY_WORKER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
