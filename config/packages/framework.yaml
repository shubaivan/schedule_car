# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    # Форми складу (адмінка на Twig) перевіряють CSRF-токен.
    csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Вхід за паролем — App\Security\PlanLoginRateLimiter (security.yaml → login_throttling).
    rate_limiter:
        plan_login_ip:
            cache_pool: cache.plan_login_limiter
            policy: fixed_window
            # Увесь завод — за одним NAT: рахуються лише невдалі спроби, стеля з запасом.
            limit: 60
            interval: '15 minutes'
        plan_login_local:
            cache_pool: cache.plan_login_limiter
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        plan_login_account:
            cache_pool: cache.plan_login_limiter
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # «Увійти через Telegram»: нові спроби з одного IP і опитування стану однією сесією.
        plan_tg_login_start:
            cache_pool: cache.plan_login_limiter
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # Стеля на IP: увесь завод за одним NAT.
        plan_tg_login_start_ip:
            cache_pool: cache.plan_login_limiter
            policy: sliding_window
            limit: 400
            interval: '15 minutes'
        plan_tg_login_status:
            cache_pool: cache.plan_login_limiter
            policy: sliding_window
            limit: 90
            interval: '1 minute'
        # Пароль (PasswordSetup): «Забули пароль?» — на людину 3 посилання на годину,
        # на IP — стеля заводу за NAT; форма нового пароля — на IP.
        plan_pw_request_account:
            cache_pool: cache.plan_login_limiter
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        plan_pw_request_ip:
            cache_pool: cache.plan_login_limiter
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        plan_pw_set_ip:
            cache_pool: cache.plan_login_limiter
            policy: sliding_window
            limit: 30
            interval: '15 minutes'

    #esi: true
    #fragments: true

when@test:
    framework:
        # Усі тести ходять з 127.0.0.1, а навмисні хибні входи кількох прогонів поспіль
        # за 15 хв вичерпали б ліміт IP. Ліміти на людину (їх і перевіряють тести) — як на проді.
        rate_limiter:
            plan_login_ip:
                cache_pool: cache.plan_login_limiter
                policy: fixed_window
                limit: 100000
                interval: '15 minutes'
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
