name: CI

on:
    push:
    pull_request:

# Той самий набір воріт, що й на chiropractor-api: формат → статичний аналіз →
# тести. Reusable-workflow'и того проєкту лежать у приватному репозиторії
# організації, тож кроки описані тут напряму.
jobs:
    PHPCSFixer:
        name: PHP-CS-Fixer
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Setup php
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: mbstring, intl, pdo_pgsql
                    tools: composer

            -   name: Install dependencies
                run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts

            -   name: Check formatting
                run: composer cs-check

    PHPStan:
        name: PHPStan
        needs: PHPCSFixer
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Setup php
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: mbstring, intl, pdo_pgsql
                    ini-values: memory_limit=1G
                    tools: composer

            -   name: Install dependencies
                run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts

            # Розширення phpstan-symfony читає контейнер, а doctrine-розширення —
            # реальний EntityManager, тож кеш dev треба прогріти заздалегідь.
            -   name: Warm up container
                env:
                    APP_ENV: dev
                    DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
                run: php bin/console cache:warmup --env=dev

            -   name: Analyse
                env:
                    DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
                run: php vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress --memory-limit=1G

    Tests:
        name: Tests
        needs: PHPCSFixer
        runs-on: ubuntu-latest
        timeout-minutes: 10

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: app_test
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: app
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd=pg_isready
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Setup php
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: mbstring, intl, pdo_pgsql
                    ini-values: memory_limit=1G
                    tools: composer

            -   name: Install dependencies
                run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts

            -   name: Run migrations
                run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

            -   name: Run tests
                run: php vendor/bin/phpunit

    Frontend:
        name: CRM frontend
        runs-on: ubuntu-latest
        timeout-minutes: 10

        defaults:
            run:
                working-directory: frontend

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Setup node
                uses: actions/setup-node@v4
                with:
                    node-version: '20'
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

            -   name: Install dependencies
                run: npm ci

            # `npm run build` — це vue-tsc --noEmit та vite build: перевірка
            # типів і збірка одним кроком.
            -   name: Type-check and build
                run: npm run build
