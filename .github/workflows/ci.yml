name: CI

# Gates of every change: composer validate -> format -> static analysis -> tests
# (PostgreSQL 14 like production) -> CRM frontend type-check and build ->
# OSV scan of both lockfiles. All jobs are self-contained (no reusable workflows).
on:
    push:
    pull_request:
    workflow_dispatch:
    schedule:
        # Daily OSV scan: new advisories appear without any change in the repo.
        - cron: "17 4 * * *"

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    PHP_VERSION: '8.5'
    PHP_EXTENSIONS: mbstring, intl, pdo_pgsql, gd, curl, iconv, ctype
    COMPOSER_FLAGS: --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts

jobs:
    composer:
        name: Composer validate
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4.2.2

            -   name: Setup php
                uses: shivammathur/setup-php@2.35.5
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    coverage: none
                    tools: composer:v2

            -   name: Validate composer.json and composer.lock
                run: composer validate --no-check-publish

    php-cs-fixer:
        name: PHP-CS-Fixer
        needs: composer
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4.2.2

            -   name: Setup php
                uses: shivammathur/setup-php@2.35.5
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    coverage: none
                    tools: composer:v2

            -   name: Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache composer downloads
                uses: actions/cache@v4.2.3
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ runner.os }}-

            -   name: Install dependencies
                run: composer install ${{ env.COMPOSER_FLAGS }}

            -   name: Check formatting
                run: composer cs-check

    phpstan:
        name: PHPStan
        needs: composer
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4.2.2

            -   name: Setup php
                uses: shivammathur/setup-php@2.35.5
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    ini-values: memory_limit=1G
                    coverage: none
                    tools: composer:v2

            -   name: Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache composer downloads
                uses: actions/cache@v4.2.3
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ runner.os }}-

            -   name: Install dependencies
                run: composer install ${{ env.COMPOSER_FLAGS }}

            # phpstan-symfony reads the compiled container and the doctrine extension
            # a real EntityManager, so the dev cache must be warm first (no DB needed).
            -   name: Warm up container
                env:
                    APP_ENV: dev
                    DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=14&charset=utf8
                run: php bin/console cache:warmup --env=dev

            -   name: Analyse
                env:
                    DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=14&charset=utf8
                run: php vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress --memory-limit=1G

    tests:
        name: Tests (PostgreSQL 14)
        needs: composer
        runs-on: ubuntu-latest
        timeout-minutes: 20

        services:
            postgres:
                # Production runs PostgreSQL 14 (plan, zayavky).
                image: postgres:14
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd=pg_isready
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        env:
            # Doctrine adds dbname_suffix "_test" in the test env: app -> app_test.
            DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=14&charset=utf8

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4.2.2

            -   name: Setup php
                uses: shivammathur/setup-php@2.35.5
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    ini-values: memory_limit=1G
                    coverage: pcov
                    tools: composer:v2

            # Same as production: the app role is not a superuser, pg_trgm is
            # pre-created by postgres (the migration's IF NOT EXISTS is then a no-op).
            -   name: Prepare database
                env:
                    PGPASSWORD: postgres
                run: |
                    psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE app LOGIN PASSWORD 'app'"
                    psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE app_test OWNER app ENCODING 'UTF8' TEMPLATE template0"
                    psql -h 127.0.0.1 -U postgres -d app_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

            -   name: Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache composer downloads
                uses: actions/cache@v4.2.3
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ runner.os }}-

            -   name: Install dependencies
                run: composer install ${{ env.COMPOSER_FLAGS }}

            -   name: Run migrations
                run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

            -   name: Run tests with coverage
                run: php vendor/bin/phpunit --coverage-text --coverage-clover=var/coverage.xml --only-summary-for-coverage-text

            -   name: Check minimum coverage
                env:
                    MIN_COVERAGE: '25'
                run: |
                    php -r '
                        $m = simplexml_load_file("var/coverage.xml")->project->metrics;
                        $pct = (int) $m["statements"] > 0 ? 100 * (int) $m["coveredstatements"] / (int) $m["statements"] : 0;
                        printf("Line coverage: %.2f%% (minimum %s%%)\n", $pct, getenv("MIN_COVERAGE"));
                        exit($pct < (float) getenv("MIN_COVERAGE") ? 1 : 0);
                    '

    frontend:
        name: CRM frontend
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        defaults:
            run:
                working-directory: frontend

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4.2.2

            -   name: Setup node
                uses: actions/setup-node@v4.4.0
                with:
                    node-version: '24'
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

            -   name: Install dependencies
                run: npm ci

            -   name: Type-check
                run: npx vue-tsc --noEmit

            -   name: Build
                run: npx vite build

    osv:
        name: OSV vulnerability scan
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4.2.2

            -   name: Scan composer.lock and frontend/package-lock.json
                uses: google/osv-scanner-action/osv-scanner-action@v2.3.0
                with:
                    scan-args: |-
                        --lockfile=composer.lock
                        --lockfile=frontend/package-lock.json
