name: OSV-Scanner Scheduled Scan

on:
    schedule:
        - cron: "17 4 * * 1"
    push:
        branches: [master]

permissions:
    actions: read
    security-events: write
    contents: read

jobs:
    scan-scheduled:
        uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.0"
        with:
            upload-sarif: false
            fail-on-vuln: false
