# Фрагмент для server { … } plan.zavodbuddetal.com.ua (443) у /etc/nginx/sites-available/plan.
# Вставити ПЕРЕД `location /` / `location ~ ^/index\.php`. Потім: nginx -t && systemctl reload nginx.

# Mercure (SSE): той самий origin → кука mercureAuthorization без CORS.
# ^~ — щоб regex-локації vhost (напр. заборона прихованих шляхів `~ /\.`) не перехопили запит.
location ^~ /.well-known/mercure {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    # Токени живуть у куці; у лог — без query-рядка.
    access_log off;
}

# Service worker Web Push: без кешу, щоб оновлення доходили одразу.
# `expires -1` (Cache-Control: no-cache) замість add_header — не скасовує заголовки рівня server (HSTS, noindex).
location = /sw.js {
    expires -1;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
}
