# «План» — файли зібраного фронту /crm/assets/ (Vite, імена з хешем). Лише vhost plan.zavodbuddetal.com.ua
# (/etc/nginx/sites-available/plan). Вставити в server { … } :443 ПЕРЕД `location / { try_files $uri /index.php… }`.
# Потім: nginx -t && systemctl reload nginx.
#
# Навіщо: без цього зниклий після деплою /crm/assets/ProfilePage-<старий хеш>.js падав у `location /`
# → /index.php → Symfony віддавав HTML-оболонку з 200. Стара вкладка отримувала HTML замість JS,
# лінивий import тихо падав — «Профіль» не відкривався. Тепер — чесний 404, і фронт сам
# перезавантажує сторінку (frontend/src/app/staleChunks.ts). CrmController теж віддає 404 як страховка.
#
# Кеш: ім'я файлу міняється з кожною збіркою, тож файл можна кешувати надовго.
# `expires` замість add_header — не скасовує заголовки рівня server (HSTS, CSP, noindex).
location ^~ /crm/assets/ {
    try_files $uri =404;
    expires 30d;
    access_log off;
}
