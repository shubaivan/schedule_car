# «План» — заголовки безпеки й стиснення JSON. Лише vhost plan.zavodbuddetal.com.ua
# (/etc/nginx/sites-available/plan); інші сайти сервера не чіпати. Після правки: nginx -t && systemctl reload nginx.
#
# 1) На рівні http — угорі файла vhost, поруч із map $plan_log_uri (імена з префіксом plan_):
#
#    CSP: SPA (/crm, Vite) і решта — лише свої скрипти; стилі inline дозволені (Twig-сторінки входу
#    та інструкції мають <style>, Vue — style-атрибути); шрифти інструкції — Google Fonts;
#    Mercure — той самий origin (connect-src 'self'); blob: — превʼю фото перед відправкою.
#    Twig-адмінка складу /sklad — свої inline-скрипти і jQuery/Select2 з jsDelivr — окремий, м'якший рядок.
map $uri $plan_csp {
    "~^/sklad(/|$)" "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

# 2) Усередині server { … } :443 (рівень server — успадковують усі location без власних add_header;
#    фрагменти Mercure / sw.js / manifest навмисно без add_header, так і тримати):
#
#    add_header Strict-Transport-Security "max-age=31536000" always;
#    add_header X-Content-Type-Options "nosniff" always;
#    add_header X-Frame-Options "SAMEORIGIN" always;
#    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#    add_header Content-Security-Policy $plan_csp always;
#    gzip_types application/json text/css application/javascript application/manifest+json image/svg+xml;
#    gzip_comp_level 4;
#    gzip_vary on;
#
# HSTS без includeSubDomains: це лише plan.*, інші піддомени zavodbuddetal.com.ua — не наша зона.
# Файли (PlanFilesController / PublicShareController) самі ставлять суворіший CSP — браузер застосовує обидва.
